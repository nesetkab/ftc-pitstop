<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script nonce="%sveltekit.nonce%">
			try {
				var theme = localStorage.getItem('ps-theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				var follows = localStorage.getItem('ps-follow');
				var hints = localStorage.getItem('ps-hints');
				var following = !!follows && follows !== '[]';
				if (following) document.documentElement.dataset.following = '';
				if (following || (hints && hints.indexOf('"intro"') !== -1)) {
					document.documentElement.dataset.returning = '';
				}
			} catch (error) {}
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
